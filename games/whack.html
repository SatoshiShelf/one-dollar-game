<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Whack-a-Mole</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c10;color:#eef1f5;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #app{width:min(96vw,460px);padding:12px;position:relative}
  .bar{display:flex;justify-content:space-between;font-size:13px;color:#98a2b3;margin-bottom:12px}
  .bar b{color:#eef1f5;font-size:16px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;aspect-ratio:1/1}
  .hole{position:relative;background:radial-gradient(circle at 50% 78%, #1a1f28 0 46%, #10131a 47%);
    border:1px solid #242a35;border-radius:14px;overflow:hidden;cursor:pointer}
  .mole{position:absolute;left:50%;bottom:-10%;width:62%;height:62%;transform:translate(-50%,40%) scale(.6);
    border-radius:50% 50% 42% 42%;background:linear-gradient(160deg,#b9764a,#8a522f);
    transition:transform .12s ease,opacity .12s;opacity:0;display:grid;place-items:center}
  .mole::before{content:"";position:absolute;top:16%;width:12%;height:12%;border-radius:50%;
    background:#000;box-shadow:0 0 0 0 #000; left:30%;}
  .mole::after{content:"";position:absolute;top:16%;width:12%;height:12%;border-radius:50%;
    background:#000; right:30%;}
  .hole.show .mole{transform:translate(-50%,0) scale(1);opacity:1}
  .hole.whack .mole{transform:translate(-50%,25%) scale(.7);opacity:0}
  .overlay{position:absolute;inset:12px;display:none;place-items:center;text-align:center;
    background:rgba(5,7,10,.9);border-radius:14px;z-index:5;padding:16px}
  .overlay.show{display:grid}
  .overlay h2{margin:0 0 6px;font-size:30px}
  .overlay .sub{color:#98a2b3;font-size:14px;margin-bottom:14px}
  .overlay button{background:linear-gradient(140deg,#f7931a,#ffc266);border:none;color:#201400;
    font-weight:700;font-size:15px;font-family:inherit;border-radius:11px;padding:12px 22px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div class="bar"><span>Score <b id="score">0</b></span><span>Time <b id="time">30</b>s</span><span>Best <b id="best">0</b></span></div>
  <div class="grid" id="grid">
    <div class="overlay" id="overlay">
      <div>
        <h2 id="ovTitle">Time!</h2>
        <div class="sub" id="ovSub"></div>
        <button id="ovBtn">Play again</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var grid=document.getElementById("grid"), overlay=document.getElementById("overlay"),
      ovTitle=document.getElementById("ovTitle"), ovSub=document.getElementById("ovSub"),
      scoreEl=document.getElementById("score"), timeEl=document.getElementById("time"), bestEl=document.getElementById("best");
  var holes=[], score, left, running, spawnTimer, countTimer;
  var best=+(localStorage.getItem("whack_best")||0);
  bestEl.textContent=best;

  for(var i=0;i<9;i++){
    var h=document.createElement("div"); h.className="hole"; h.dataset.i=i;
    h.innerHTML='<div class="mole"></div>';
    h.addEventListener("click", function(){ whack(this); });
    holes.push(h); grid.insertBefore(h, overlay);
  }
  function showMole(i){
    var h=holes[i]; if(h.classList.contains("show")) return;
    h.classList.add("show"); h.classList.remove("whack");
    var life=520 + Math.random()*520 + Math.max(0,(30-left))*18;
    h.dataset.hideAt=Date.now()+life;
    setTimeout(function(){
      if(h.classList.contains("show") && !h.classList.contains("whack")) h.classList.remove("show");
    }, life);
  }
  function whack(h){
    if(!running || !h.classList.contains("show")) return;
    h.classList.add("whack"); h.classList.remove("show");
    score++; scoreEl.textContent=score;
  }
  function tick(){
    if(!running) return;
    left--; timeEl.textContent=Math.max(0,left);
    if(left<=0) end();
  }
  function spawnLoop(){
    if(!running) return;
    var i=(Math.random()*9)|0;
    showMole(i);
    var rate=Math.max(300, 720 - (30-left)*14);
    spawnTimer=setTimeout(spawnLoop, rate);
  }
  function start(){
    running=true; score=0; left=30; scoreEl.textContent="0"; timeEl.textContent="30";
    overlay.classList.remove("show");
    holes.forEach(function(h){ h.classList.remove("show","whack"); });
    clearTimeout(spawnTimer); clearInterval(countTimer);
    spawnTimer=setTimeout(spawnLoop, 500);
    countTimer=setInterval(tick, 1000);
  }
  function end(){
    running=false; clearTimeout(spawnTimer); clearInterval(countTimer);
    holes.forEach(function(h){ h.classList.remove("show"); });
    var isBest=false;
    if(score>best){ best=score; localStorage.setItem("whack_best",best); bestEl.textContent=best; isBest=true; }
    ovTitle.textContent="Time!";
    ovSub.textContent="You whacked "+score+" mole"+(score===1?"":"s")+(isBest?"  ·  new best!":"");
    overlay.classList.add("show");
  }
  document.getElementById("ovBtn").addEventListener("click", start);
  grid.addEventListener("click", function(e){ if(!running && !e.target.closest("button")) start(); });
  start();
})();
</script>
</body>
</html>
