<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Simon Says</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c10;color:#eef1f5;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #app{width:min(96vw,440px);padding:12px;text-align:center}
  .bar{display:flex;justify-content:space-between;font-size:13px;color:#98a2b3;margin-bottom:12px}
  .bar b{color:#eef1f5;font-size:16px}
  .board{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;aspect-ratio:1/1}
  .pad{border-radius:18px;cursor:pointer;transition:filter .12s,transform .08s;
    border:2px solid rgba(255,255,255,.08)}
  .pad:active{transform:scale(.98)}
  .pad.g{background:#20a85f} .pad.r{background:#d64545} .pad.y{background:#d8a12a} .pad.b{background:#2f77c9}
  .pad.lit{filter:brightness(1.9) saturate(1.3);box-shadow:0 0 26px rgba(255,255,255,.4)}
  .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38%;aspect-ratio:1/1;
    border-radius:50%;background:#0f1218;border:2px solid #242a35;display:grid;place-items:center}
  .center .n{font-size:clamp(20px,7vw,34px);font-weight:800}
  .center .l{font-size:11px;color:#98a2b3;letter-spacing:.1em}
  .status{text-align:center;margin-top:14px;font-size:15px;font-weight:600;min-height:22px}
  .status.win{color:#22c55e} .status.lose{color:#ef4444}
  .again{display:none;margin:12px auto 0;background:linear-gradient(140deg,#f7931a,#ffc266);border:none;color:#201400;
    font-weight:700;font-size:15px;font-family:inherit;border-radius:11px;padding:11px 22px;cursor:pointer}
  .again.show{display:block}
</style>
</head>
<body>
<div id="app">
  <div class="bar"><span>Round <b id="round">0</b></span><span>Best <b id="best">0</b></span></div>
  <div class="board" id="board">
    <div class="pad g" data-i="0"></div>
    <div class="pad r" data-i="1"></div>
    <div class="pad y" data-i="2"></div>
    <div class="pad b" data-i="3"></div>
    <div class="center"><div><div class="n" id="centerN">GO</div><div class="l">TAP TO START</div></div></div>
  </div>
  <div class="status" id="status"></div>
  <button class="again" id="again">Play again</button>
</div>
<script>
(function(){
  var board=document.getElementById("board"), pads=[].slice.call(board.querySelectorAll(".pad"));
  var roundEl=document.getElementById("round"), bestEl=document.getElementById("best"),
      statusEl=document.getElementById("status"), again=document.getElementById("again"),
      centerN=document.getElementById("centerN");
  var seq, idx, state, best=+(localStorage.getItem("simon_best")||0);
  var FREQ=[329.63, 261.63, 392.00, 196.00];
  bestEl.textContent=best;
  var actx=null;
  function tone(i, dur){
    try {
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      var o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.value=FREQ[i];
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.18, actx.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
      o.start(); o.stop(actx.currentTime+dur+0.02);
    } catch(e){}
  }
  function flash(i, dur){
    pads[i].classList.add("lit");
    tone(i, dur);
    setTimeout(function(){ pads[i].classList.remove("lit"); }, dur*1000);
  }
  function start(){
    seq=[]; idx=0; state="show"; statusEl.textContent=""; statusEl.className="status";
    again.classList.remove("show");
    nextRound();
  }
  function nextRound(){
    seq.push((Math.random()*4)|0);
    roundEl.textContent=seq.length;
    centerN.textContent=seq.length;
    playSeq(0);
  }
  function playSeq(i){
    state="show";
    if(i>=seq.length){ setTimeout(function(){ state="input"; idx=0; statusEl.textContent="Your turn"; }, 320); return; }
    flash(seq[i], 0.42);
    setTimeout(function(){ playSeq(i+1); }, 560);
  }
  function press(i){
    if(state==="over") return;
    if(state!=="input"){ if(state==="idle") start(); return; }
    flash(i, 0.18);
    if(seq[idx]===i){
      idx++;
      if(idx===seq.length){
        state="show"; statusEl.textContent="Nice!";
        if(seq.length>best){ best=seq.length; localStorage.setItem("simon_best",best); bestEl.textContent=best; }
        setTimeout(nextRound, 700);
      }
    } else {
      state="over";
      statusEl.textContent="Wrong! You reached round "+seq.length;
      statusEl.className="status lose"; again.classList.add("show");
    }
  }
  pads.forEach(function(p, i){ p.addEventListener("click", function(){ press(i); }); });
  board.addEventListener("click", function(e){ if(state==="idle" && !e.target.classList.contains("pad") && !e.target.closest(".pad")) start(); });
  document.querySelector(".center").addEventListener("click", function(){ if(state==="idle"){ start(); } });
  again.addEventListener("click", start);
  state="idle";
  statusEl.textContent="Watch the pattern, then repeat it.";
})();
</script>
</body>
</html>
