<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Lights Out</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c10;overflow:hidden;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  #app{width:min(94vw,440px);padding:12px;text-align:center;position:relative}
  .bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#98a2b3;margin-bottom:14px}
  .bar b{color:#eef1f5}
  .bar button{background:#14171f;border:1px solid #242a35;color:#eef1f5;border-radius:9px;padding:8px 12px;
    font-family:inherit;font-size:13px;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;aspect-ratio:1/1}
  .cell{border-radius:12px;cursor:pointer;border:1px solid #242a35;background:#12151c;
    transition:background .12s,box-shadow .12s}
  .cell::after{content:"";display:block;padding-top:100%}
  .cell.on{background:radial-gradient(circle at 50% 40%, #ffd27a, #f7931a);border-color:#f7931a;
    box-shadow:0 0 18px rgba(247,147,26,.55)}
  .cell:hover{filter:brightness(1.12)}
  .overlay{position:absolute;inset:12px;display:none;place-items:center;text-align:center;
    background:rgba(5,7,10,.88);border-radius:14px;padding:16px;z-index:5}
  .overlay.show{display:grid}
  .overlay h2{margin:0 0 6px;font-size:28px;color:#22c55e}
  .overlay p{margin:0 0 14px;color:#98a2b3;font-size:14px}
  .overlay button{background:linear-gradient(140deg,#f7931a,#ffc266);border:none;color:#201400;
    font-weight:700;font-size:15px;font-family:inherit;border-radius:11px;padding:12px 22px;cursor:pointer}
  .hint{margin-top:12px;font-size:12px;color:#6b7480}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <span>Taps <b id="taps">0</b></span>
    <span>Best <b id="best">-</b></span>
    <button id="new">New</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="hint">Tapping a light flips it and its four neighbours. Turn them all off.</div>
  <div class="overlay" id="overlay">
    <div>
      <h2>Lights out!</h2>
      <p id="ovSub"></p>
      <button id="ovBtn">Play again</button>
    </div>
  </div>
</div>
<script>
(function(){
  var N=5, gridEl=document.getElementById("grid"), overlay=document.getElementById("overlay"),
      ovSub=document.getElementById("ovSub"), tapsEl=document.getElementById("taps"), bestEl=document.getElementById("best");
  var state, taps, solved, best=+(localStorage.getItem("lo_best")||0);
  bestEl.textContent = best>0 ? best : "-";
  var cells=[];

  for(var i=0;i<N*N;i++){
    var d=document.createElement("div");
    d.className="cell"; d.dataset.i=i;
    gridEl.appendChild(d);
    cells.push(d);
  }
  function idx(r,c){ return r*N+c; }
  function isOn(r,c){ return r>=0&&c>=0&&r<N&&c<N && state[idx(r,c)]; }
  function toggle(i){
    if(solved) return;
    var r=Math.floor(i/N), c=i%N;
    [[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
      var rr=r+d[0], cc=c+d[1];
      if(rr>=0&&cc>=0&&rr<N&&cc<N) state[idx(rr,cc)]=!state[idx(rr,cc)];
    });
    taps++; tapsEl.textContent=taps;
    render();
    checkWin();
  }
  function render(){
    for(var i=0;i<N*N;i++) cells[i].classList.toggle("on", !!state[i]);
  }
  function checkWin(){
    if(state.some(function(v){ return v; })) return;
    solved=true;
    if(taps<=best || best===0){ best=taps; localStorage.setItem("lo_best",best); bestEl.textContent=best; }
    ovSub.textContent="Cleared in "+taps+" tap"+(taps===1?"":"s")+"  ·  best "+best;
    overlay.classList.add("show");
  }
  function newGame(){
    do {
      state=new Array(N*N).fill(false);
      var n=6+((Math.random()*6)|0);
      for(var k=0;k<n;k++){
        var r=(Math.random()*N)|0, c=(Math.random()*N)|0;
        [[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
          var rr=r+d[0], cc=c+d[1];
          if(rr>=0&&cc>=0&&rr<N&&cc<N) state[idx(rr,cc)]=!state[idx(rr,cc)];
        });
      }
    } while(state.every(function(v){ return !v; }));
    taps=0; solved=false; tapsEl.textContent="0";
    overlay.classList.remove("show");
    render();
  }
  cells.forEach(function(cell, i){ cell.addEventListener("click", function(){ toggle(i); }); });
  document.getElementById("new").addEventListener("click", newGame);
  document.getElementById("ovBtn").addEventListener("click", newGame);
  newGame();
})();
</script>
</body>
</html>
