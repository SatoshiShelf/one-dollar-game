<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Reaction Test</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c10;overflow:hidden;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  #app{width:min(94vw,560px);padding:12px}
  .panel{height:min(58vh,380px);border-radius:16px;display:grid;place-items:center;text-align:center;
    cursor:pointer;user-select:none;transition:background .12s;background:#2a3346;border:2px solid #242a35}
  .panel.wait{background:#b3372f;border-color:#e0554b}
  .panel.go{background:#1f9d55;border-color:#22c55e}
  .panel.soon{background:#c98a1b;border-color:#f5c518}
  .panel .big{font-size:clamp(26px,8vw,44px);font-weight:800;color:#fff}
  .panel .small{margin-top:8px;font-size:14px;color:rgba(255,255,255,.8)}
  .info{display:flex;justify-content:space-between;margin-top:14px;font-size:14px;color:#98a2b3}
  .info b{color:#eef1f5}
  .times{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center;min-height:30px}
  .chip{background:#14171f;border:1px solid #242a35;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:700;color:#eef1f5}
  .chip.best{color:#22c55e;border-color:#22c55e}
  button{display:block;margin:14px auto 0;background:#14171f;border:1px solid #242a35;color:#eef1f5;
    border-radius:10px;padding:10px 18px;font-family:inherit;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div class="panel" id="panel">
    <div>
      <div class="big" id="big">Click to begin</div>
      <div class="small" id="small">Wait for green, then click as fast as you can.</div>
    </div>
  </div>
  <div class="info"><span>Trial <b id="trial">0</b>/5</span><span>Average <b id="avg">-</b></span></div>
  <div class="times" id="times"></div>
  <button id="reset">Restart</button>
</div>
<script>
(function(){
  var panel=document.getElementById("panel"), big=document.getElementById("big"), small=document.getElementById("small"),
      trialEl=document.getElementById("trial"), avgEl=document.getElementById("avg"), timesEl=document.getElementById("times");
  var ROUNDS=5;
  var state="idle", tries=[], t0=0, timeout=null;
  var best=+(localStorage.getItem("reaction_best")||0);

  function setPanel(cls, b, s){ panel.className="panel"+(cls?" "+cls:""); big.textContent=b; small.textContent=s; }
  function renderChips(){
    timesEl.innerHTML="";
    tries.forEach(function(t){ var d=document.createElement("span"); d.className="chip"; d.textContent=Math.round(t)+" ms"; timesEl.appendChild(d); });
    trialEl.textContent=tries.length;
    if(tries.length){ var a=tries.reduce(function(x,y){return x+y;},0)/tries.length; avgEl.textContent=Math.round(a)+" ms"; }
    else avgEl.textContent="-";
  }
  function reset(){
    clearTimeout(timeout);
    tries=[]; state="idle"; renderChips();
    setPanel("", "Click to begin", "Wait for green, then click as fast as you can.");
  }
  function nextTrial(){
    if(tries.length>=ROUNDS){ finish(); return; }
    state="wait";
    setPanel("wait", "Wait for green\u2026", "Trial "+(tries.length+1)+" of "+ROUNDS);
    timeout=setTimeout(function(){
      state="go"; t0=performance.now();
      setPanel("go", "CLICK!", "Go go go!");
    }, 1500+Math.random()*2500);
  }
  function finish(){
    state="done";
    var avg=tries.reduce(function(x,y){return x+y;},0)/tries.length;
    var isBest=false;
    if(best===0||avg<best){ best=avg; localStorage.setItem("reaction_best",best); isBest=true; }
    setPanel("go", Math.round(avg)+" ms average", "Best "+Math.round(best)+" ms"+(isBest?"  \u00b7  new record!":"")+"  \u00b7  click to retry");
  }
  panel.addEventListener("click", function(){
    if(state==="idle"||state==="done"){ tries=[]; renderChips(); nextTrial(); return; }
    if(state==="wait"){ clearTimeout(timeout); state="soon"; setPanel("soon", "Too soon!", "You clicked before green. Click to retry this trial."); return; }
    if(state==="soon"){ nextTrial(); return; }
    if(state==="go"){
      var t=performance.now()-t0;
      tries.push(t); renderChips();
      if(tries.length>=ROUNDS){ finish(); }
      else { nextTrial(); }
    }
  });
  document.getElementById("reset").addEventListener("click", function(e){ e.stopPropagation(); reset(); });
  reset();
})();
</script>
</body>
</html>
