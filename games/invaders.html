<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Space Invaders</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c10;color:#eef1f5;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{max-width:100%;max-height:100%;width:auto;height:auto;touch-action:none;
    border-radius:10px;background:#05070a;box-shadow:0 12px 40px -12px rgba(0,0,0,.8)}
</style>
</head>
<body>
<canvas id="c" width="480" height="440"></canvas>
<script>
(function(){
  var cv=document.getElementById("c"), ctx=cv.getContext("2d");
  var W=cv.width, H=cv.height;
  var PAD=16, AL_W=26, AL_H=18, SPX=40, SPY=30, COLS=5, ROWS=4;
  var player, aliens, pBullet, bombs, fx, fy, vx, score, best, lives, state, cool, fireHold;
  best = +(localStorage.getItem("invaders_best") || 0);

  function formationWidth(){ return COLS*SPX; }
  function reset(keepScore){
    if(!keepScore){ score=0; lives=3; }
    player={x:W/2, w:44, h:16, y:H-34, tx:null};
    aliens=[];
    for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++)
      aliens.push({r:r, c:c, a:true, w:AL_W, h:AL_H});
    fx=(W-formationWidth())/2; fy=64; vx=1.3;
    pBullet=null; bombs=[]; cool=0; fireHold=false; state="play";
  }
  function aliveCount(){ return aliens.filter(function(a){return a.a;}).length; }
  function alienX(a){ return fx + a.c*SPX; }
  function alienY(a){ return fy + a.r*SPY; }

  function shoot(){
    if(state!=="play" || pBullet) return;
    pBullet={x:player.x, y:player.y-6, vy:-9};
  }
  function hitPlayer(){
    lives--;
    if(lives<=0){ state="over"; if(score>best){ best=score; localStorage.setItem("invaders_best",best); } }
    else { player.x=W/2; bombs=[]; }
  }
  function step(){
    if(state!=="play"){
      // freeze; advance frame for blinking handled in draw via time
      return;
    }
    // move player toward pointer target
    if(player.tx!=null){ player.x=Math.max(24, Math.min(W-24, player.x + Math.sign(player.tx-player.x)*Math.min(6, Math.abs(player.tx-player.x)))); }
    // player bullet
    if(pBullet){
      pBullet.y+=pBullet.vy;
      if(pBullet.y<0) pBullet=null;
    }
    // formation
    var speed=1.2 + (20-aliveCount())*0.11;
    var dirSign=Math.sign(vx);
    fx += dirSign*speed;
    var minX=1e9, maxX=-1e9;
    aliens.forEach(function(a){ if(a.a){ minX=Math.min(minX,alienX(a)); maxX=Math.max(maxX,alienX(a)+a.w); } });
    if(maxX>W-PAD || minX<PAD){ vx=-vx; fy+=16; }
    // bullet vs aliens
    if(pBullet){
      for(var i=0;i<aliens.length;i++){
        var a=aliens[i]; if(!a.a) continue;
        if(pBullet.x>alienX(a) && pBullet.x<alienX(a)+a.w && pBullet.y>alienY(a) && pBullet.y<alienY(a)+a.h){
          a.a=false; pBullet=null; score+=10;
          if(aliveCount()===0){ state="won"; if(score>best){ best=score; localStorage.setItem("invaders_best",best); } }
          break;
        }
      }
    }
    // alien bombs
    if(Math.random()<0.02 + (20-aliveCount())*0.0015 && bombs.length<4){
      var live=aliens.filter(function(a){return a.a;});
      if(live.length){
        var s=live[(Math.random()*live.length)|0];
        bombs.push({x:alienX(s)+s.w/2, y:alienY(s)+s.h, vy:3.2});
      }
    }
    for(var b=bombs.length-1;b>=0;b--){
      bombs[b].y+=bombs[b].vy;
      if(bombs[b].y>H){ bombs.splice(b,1); continue; }
      if(Math.abs(bombs[b].x-player.x)<player.w/2+3 && bombs[b].y>player.y-player.h/2 && bombs[b].y<player.y+player.h){
        bombs.splice(b,1); hitPlayer(); if(state!=="play") return;
      }
    }
    // aliens reach player line
    aliens.forEach(function(a){ if(a.a && alienY(a)+a.h>=player.y-player.h/2){ state="over"; if(score>best){ best=score; localStorage.setItem("invaders_best",best); } } });
  }
  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); }
  function draw(){
    ctx.fillStyle="#05070a"; ctx.fillRect(0,0,W,H);
    // stars
    ctx.fillStyle="rgba(255,255,255,.35)";
    for(var s=0;s<40;s++){ var sx=(s*97)%W, sy=(s*53)%H; ctx.fillRect(sx, (sy+ (Date.now()/60 % 60))%H, 1.5,1.5); }
    // aliens
    aliens.forEach(function(a){ if(!a.a) return;
      ctx.fillStyle= a.r===0?"#f7931a": a.r===1?"#38bdf8": a.r===2?"#a855f7":"#22c55e";
      var x=alienX(a), y=alienY(a);
      rr(x, y+4, a.w, a.h-4, 4);
      ctx.fillStyle="#05070a";
      ctx.fillRect(x+5, y+9, 4, 4); ctx.fillRect(x+a.w-9, y+9, 4, 4);
    });
    // player
    ctx.fillStyle="#eef1f5";
    ctx.beginPath();
    ctx.moveTo(player.x, player.y-player.h);
    ctx.lineTo(player.x+player.w/2, player.y);
    ctx.lineTo(player.x-player.w/2, player.y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle="#f7931a"; rr(player.x-3, player.y-player.h-4, 6, 6, 2);
    // bullets
    if(pBullet){ ctx.fillStyle="#ffc266"; rr(pBullet.x-2, pBullet.y-10, 4, 12, 2); }
    bombs.forEach(function(b){ ctx.fillStyle="#ef4444"; ctx.beginPath(); ctx.arc(b.x,b.y,4,0,7); ctx.fill(); });
    // hud
    ctx.textAlign="left"; ctx.fillStyle="#98a2b3"; ctx.font="600 14px Inter, Arial";
    ctx.fillText("SCORE "+score, 12, 24);
    ctx.textAlign="right"; ctx.fillText("BEST "+best, W-12, 24);
    ctx.textAlign="center"; ctx.fillText("LIVES "+"\u2665".repeat(Math.max(0,lives)), W/2, 24);
    if(state==="over"||state==="won"){
      ctx.fillStyle="rgba(5,7,10,.85)"; ctx.fillRect(0,0,W,H);
      ctx.textAlign="center";
      ctx.fillStyle=state==="won"?"#22c55e":"#ef4444"; ctx.font="800 34px Inter, Arial";
      ctx.fillText(state==="won"?"Planet saved!":"Invaded", W/2, H/2-24);
      ctx.fillStyle="#f7931a"; ctx.font="700 22px Inter, Arial";
      ctx.fillText("Score "+score, W/2, H/2+12);
      ctx.fillStyle="#98a2b3"; ctx.font="500 14px Inter, Arial";
      ctx.fillText("Press Space or tap to play again", W/2, H/2+48);
    }
  }
  var last=0, acc=0;
  function loop(t){
    requestAnimationFrame(loop);
    if(!last) last=t; acc+=t-last; last=t;
    while(acc>=16.6){ acc-=16.6; step(); }
    if(fireHold && state==="play"){ cool++; if(cool>=22){ cool=0; shoot(); } }
    draw();
  }
  function action(){ if(state==="over"||state==="won"){ reset(false); } else shoot(); }
  addEventListener("keydown", function(e){
    if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A"){ player.tx=Math.max(24, (player.tx==null?player.x:player.tx)-26); }
    else if(e.key==="ArrowRight"||e.key==="d"||e.key==="D"){ player.tx=Math.min(W-24,(player.tx==null?player.x:player.tx)+26); }
    else if(e.key===" "){ e.preventDefault(); action(); }
  });
  function setTarget(clientX){ var r=cv.getBoundingClientRect(); player.tx=(clientX-r.left)*W/r.width; }
  cv.addEventListener("mousemove", function(e){ setTarget(e.clientX); });
  cv.addEventListener("mousedown", function(e){ setTarget(e.clientX); action(); });
  cv.addEventListener("touchstart", function(e){ e.preventDefault(); setTarget(e.touches[0].clientX); fireHold=true; cool=22; }, {passive:false});
  cv.addEventListener("touchmove", function(e){ setTarget(e.touches[0].clientX); }, {passive:false});
  cv.addEventListener("touchend", function(){ fireHold=false; action(); }, {passive:true});

  reset(false);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
