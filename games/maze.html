<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Maze Runner</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c10;overflow:hidden;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(94vw,640px);height:min(94vh,720px)}
  canvas{display:block;width:100%;height:100%;background:#0d1017;border:1px solid #242a35;border-radius:14px;touch-action:none}
  .hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;
    font-size:13px;color:#98a2b3;font-weight:600;pointer-events:none}
  .hud b{color:#eef1f5;font-size:16px}
  .overlay{position:absolute;inset:0;display:none;place-items:center;text-align:center;
    background:rgba(5,7,10,.85);border-radius:14px;padding:16px}
  .overlay.show{display:grid}
  .overlay h2{margin:0 0 6px;font-size:28px;color:#22c55e}
  .overlay p{margin:0 0 14px;color:#98a2b3;font-size:14px}
  .overlay button{background:linear-gradient(140deg,#f7931a,#ffc266);border:none;color:#201400;
    font-weight:700;font-size:15px;font-family:inherit;border-radius:11px;padding:12px 22px;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="640" height="720"></canvas>
  <div class="hud"><span>Time <b id="time">0s</b></span><span>Best <b id="best">-</b></span></div>
  <div class="overlay" id="overlay">
    <div>
      <h2>You escaped!</h2>
      <p id="ovSub"></p>
      <button id="ovBtn">New maze</button>
    </div>
  </div>
</div>
<script>
(function(){
  var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
  var W=cv.width, H=cv.height;
  var timeEl=document.getElementById("time"), bestEl=document.getElementById("best"),
      overlay=document.getElementById("overlay"), ovSub=document.getElementById("ovSub");
  var N=15, size, ox, oy;
  var vwall, hwall, pr, pc, started, secs, timer, won;
  var best=+(localStorage.getItem("maze_best")||0);
  bestEl.textContent = best>0 ? best+"s" : "-";

  function gen(){
    size=Math.floor(Math.min((W-40)/N, (H-90)/N));
    ox=(W-size*N)/2; oy=70;
    vwall=[]; hwall=[];
    for(var r=0;r<N;r++){
      vwall.push(new Array(N).fill(true));
      hwall.push(new Array(N).fill(true));
    }
    var visited=[];
    for(var r=0;r<N;r++) visited.push(new Array(N).fill(false));
    var stack=[[0,0]];
    visited[0][0]=true;
    while(stack.length){
      var cur=stack[stack.length-1], r=cur[0], c=cur[1], nbrs=[];
      if(r>0 && !visited[r-1][c]) nbrs.push([r-1,c,"N"]);
      if(r<N-1 && !visited[r+1][c]) nbrs.push([r+1,c,"S"]);
      if(c>0 && !visited[r][c-1]) nbrs.push([r,c-1,"W"]);
      if(c<N-1 && !visited[r][c+1]) nbrs.push([r,c+1,"E"]);
      if(!nbrs.length){ stack.pop(); continue; }
      var n=nbrs[(Math.random()*nbrs.length)|0];
      if(n[2]==="N") hwall[r-1][c]=false;
      else if(n[2]==="S") hwall[r][c]=false;
      else if(n[2]==="W") vwall[r][c-1]=false;
      else if(n[2]==="E") vwall[r][c]=false;
      visited[n[0]][n[1]]=true;
      stack.push([n[0],n[1]]);
    }
    pr=0; pc=0; started=false; won=false; secs=0; timeEl.textContent="0s";
    if(timer) clearInterval(timer); timer=null;
    overlay.classList.remove("show");
  }
  function startTimer(){ if(started||won) return; started=true; timer=setInterval(function(){ secs++; timeEl.textContent=secs+"s"; },1000); }
  function move(dr,dc){
    if(won) return;
    var nr=pr+dr, nc=pc+dc;
    if(nr<0||nc<0||nr>=N||nc>=N) return;
    if(dr===-1 && hwall[pr-1][pc]) return;
    if(dr===1 && hwall[pr][pc]) return;
    if(dc===-1 && vwall[pr][pc-1]) return;
    if(dc===1 && vwall[pr][pc]) return;
    startTimer();
    pr=nr; pc=nc;
    if(pr===N-1 && pc===N-1){
      won=true; if(timer) clearInterval(timer); timer=null;
      if(best===0||secs<best){ best=secs; localStorage.setItem("maze_best",best); bestEl.textContent=best+"s"; }
      ovSub.textContent="Finished in "+secs+"s  ·  best "+best+"s";
      overlay.classList.add("show");
    }
  }
  function draw(){
    ctx.fillStyle="#0d1017"; ctx.fillRect(0,0,W,H);
    // goal
    ctx.fillStyle="rgba(34,197,94,.25)";
    ctx.fillRect(ox+(N-1)*size, oy+(N-1)*size, size, size);
    ctx.fillStyle="#22c55e";
    ctx.font="bold "+Math.floor(size*0.6)+"px Arial";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("\u2605", ox+(N-0.5)*size, oy+(N-0.5)*size);
    ctx.strokeStyle="#3a4253"; ctx.lineWidth=2;
    ctx.beginPath();
    for(var r=0;r<N;r++){
      for(var c=0;c<N;c++){
        var x=ox+c*size, y=oy+r*size;
        if(r===0 || hwall[r-1][c]){ ctx.moveTo(x,y); ctx.lineTo(x+size,y); }
        if(c===0 || vwall[r][c-1]){ ctx.moveTo(x,y); ctx.lineTo(x,y+size); }
        if(c===N-1){ ctx.moveTo(x+size,y); ctx.lineTo(x+size,y+size); }
        if(r===N-1){ ctx.moveTo(x,y+size); ctx.lineTo(x+size,y+size); }
      }
    }
    ctx.stroke();
    ctx.fillStyle="#f7931a";
    ctx.beginPath();
    ctx.arc(ox+(pc+0.5)*size, oy+(pr+0.5)*size, size*0.3, 0, 7);
    ctx.fill();
  }
  addEventListener("keydown", function(e){
    var k=e.key;
    if(k==="ArrowUp"||k==="w"||k==="W") move(-1,0);
    else if(k==="ArrowDown"||k==="s"||k==="S") move(1,0);
    else if(k==="ArrowLeft"||k==="a"||k==="A") move(0,-1);
    else if(k==="ArrowRight"||k==="d"||k==="D") move(0,1);
    else if(k==="n"||k==="N") gen();
    if(k.indexOf("Arrow")===0) e.preventDefault();
  });
  document.getElementById("ovBtn").addEventListener("click", gen);
  gen();
  (function loop(){ draw(); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
