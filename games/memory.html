<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Memory Match</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c10;color:#eef1f5;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #app{width:min(96vw,460px);padding:12px}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:13px;color:#98a2b3}
  .bar b{color:#eef1f5;font-size:16px}
  .bar .restart{background:#14171f;border:1px solid #242a35;color:#eef1f5;border-radius:9px;
    padding:8px 12px;font-family:inherit;font-size:13px;cursor:pointer}
  .bar .restart:hover{background:#191d26}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative}
  .card{aspect-ratio:1/1;perspective:600px;cursor:pointer}
  .inner{position:relative;width:100%;height:100%;transition:transform .28s;transform-style:preserve-3d}
  .card.open .inner,.card.done .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:12px;display:grid;place-items:center;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:clamp(22px,7vw,34px)}
  .back{background:linear-gradient(140deg,#1b2029,#12151b);border:1px solid #242a35;color:#f7931a;font-weight:800;font-size:20px}
  .front{background:#14171f;border:1px solid #2a3140;transform:rotateY(180deg)}
  .card.done .front{border-color:#22c55e;background:rgba(34,197,94,.12)}
  .overlay{position:absolute;inset:0;display:none;place-items:center;text-align:center;
    background:rgba(5,7,10,.88);border-radius:14px;z-index:5;padding:16px}
  .overlay.show{display:grid}
  .overlay h2{margin:0 0 8px;font-size:30px}
  .overlay .sub{color:#98a2b3;font-size:14px;margin-bottom:16px}
  .overlay button{background:linear-gradient(140deg,#f7931a,#ffc266);border:none;color:#201400;
    font-weight:700;font-size:15px;font-family:inherit;border-radius:11px;padding:12px 20px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <span>Moves <b id="moves">0</b></span>
    <span>Time <b id="time">0s</b></span>
    <span>Best <b id="best">—</b></span>
    <button class="restart" id="restart">Restart</button>
  </div>
  <div class="grid" id="grid">
    <div class="overlay" id="overlay">
      <div>
        <h2 id="ovTitle">You win!</h2>
        <div class="sub" id="ovSub"></div>
        <button id="ovBtn">Play again</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var SET=["\uD83E\uDD8A","\uD83D\uDC3C","\uD83D\uDC38","\uD83E\uDD89","\uD83D\uDC19","\uD83E\uDD84","\uD83D\uDC1D","\uD83E\uDD8B"];
  var grid=document.getElementById("grid"), movesEl=document.getElementById("moves"),
      timeEl=document.getElementById("time"), bestEl=document.getElementById("best");
  var overlay=document.getElementById("overlay"), ovTitle=document.getElementById("ovTitle"),
      ovSub=document.getElementById("ovSub"), ovBtn=document.getElementById("ovBtn");
  var first=null, lock=false, matched=0, moves=0, secs=0, timer=null, started=false;
  var best = +(localStorage.getItem("memory_best") || 0);
  bestEl.textContent = best ? best+"s" : "\u2014";

  function fmt(s){ return s+"s"; }
  function tick(){ secs++; timeEl.textContent=fmt(secs); }

  function build(){
    grid.querySelectorAll(".card").forEach(function(n){ n.remove(); });
    first=null; lock=false; matched=0; moves=0; secs=0; started=false;
    if(timer){ clearInterval(timer); timer=null; }
    movesEl.textContent="0"; timeEl.textContent="0s";
    overlay.classList.remove("show");
    var deck=SET.concat(SET);
    for(var i=deck.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0; var t=deck[i];deck[i]=deck[j];deck[j]=t; }
    deck.forEach(function(sym){
      var card=document.createElement("div");
      card.className="card";
      card.dataset.sym=sym;
      card.innerHTML='<div class="inner"><div class="face back">?</div><div class="face front">'+sym+'</div></div>';
      card.addEventListener("click", function(){ flip(card); });
      grid.appendChild(card);
    });
  }
  function startTimer(){
    if(started) return; started=true;
    timer=setInterval(tick,1000);
  }
  function flip(card){
    if(lock || card.classList.contains("open") || card.classList.contains("done")) return;
    startTimer();
    card.classList.add("open");
    if(!first){ first=card; return; }
    moves++; movesEl.textContent=moves;
    var second=card;
    if(first.dataset.sym===second.dataset.sym){
      first.classList.add("done"); second.classList.add("done");
      first.classList.remove("open"); second.classList.remove("open");
      first=null; matched++;
      if(matched===SET.length) win();
    } else {
      lock=true;
      var a=first, b=second; first=null;
      setTimeout(function(){
        a.classList.remove("open"); b.classList.remove("open");
        lock=false;
      }, 640);
    }
  }
  function win(){
    if(timer) clearInterval(timer); timer=null;
    var isBest=false;
    if(!best || secs<best){ best=secs; localStorage.setItem("memory_best",best); isBest=true; }
    bestEl.textContent=best+"s";
    ovTitle.textContent="You win!";
    ovSub.textContent="Cleared in "+moves+" moves and "+fmt(secs)+(isBest?"  ·  new best!":"");
    overlay.classList.add("show");
  }
  document.getElementById("restart").addEventListener("click", build);
  ovBtn.addEventListener("click", build);
  build();
})();
</script>
</body>
</html>
