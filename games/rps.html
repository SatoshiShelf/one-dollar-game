<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Rock Paper Scissors</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c10;overflow:hidden;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#eef1f5}
  body{display:flex;align-items:center;justify-content:center}
  #app{width:min(94vw,520px);padding:12px;text-align:center}
  .score{display:flex;justify-content:center;gap:30px;font-size:14px;color:#98a2b3;margin-bottom:8px}
  .score b{color:#eef1f5;font-size:22px;display:block}
  .score .you b{color:#38bdf8} .score .cpu b{color:#f7931a}
  .arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
    background:#0f1218;border:1px solid #242a35;border-radius:16px;padding:22px 14px;margin-bottom:14px}
  .slot{font-size:clamp(46px,15vw,74px);line-height:1.2}
  .slot.pulse{animation:pulse .3s}
  @keyframes pulse{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .who{font-size:12px;color:#98a2b3;letter-spacing:.12em}
  .vs{font-size:16px;color:#4b5566;font-weight:800}
  .msg{font-size:16px;font-weight:700;min-height:24px;margin-bottom:14px}
  .msg.win{color:#22c55e} .msg.lose{color:#ef4444} .msg.tie{color:#f5c518}
  .choices{display:flex;gap:10px;justify-content:center}
  .choices button{flex:1;background:#14171f;border:1px solid #242a35;color:#eef1f5;border-radius:14px;
    padding:16px 8px;font-family:inherit;font-size:30px;cursor:pointer;transition:transform .1s,border-color .12s}
  .choices button span{display:block;font-size:12px;color:#98a2b3;margin-top:6px;letter-spacing:.06em}
  .choices button:hover{border-color:#f7931a;transform:translateY(-2px)}
  .final{font-size:20px;font-weight:800;margin-top:14px;min-height:26px}
</style>
</head>
<body>
<div id="app">
  <div class="score">
    <span class="you">You<b id="youScore">0</b></span>
    <span>First to 3<b id="round">Match 1</b></span>
    <span class="cpu">CPU<b id="cpuScore">0</b></span>
  </div>
  <div class="arena">
    <div><div class="slot" id="youPick">\u2753</div><div class="who">YOU</div></div>
    <div class="vs">VS</div>
    <div><div class="slot" id="cpuPick">\u2753</div><div class="who">CPU</div></div>
  </div>
  <div class="msg" id="msg">Pick your move.</div>
  <div class="choices">
    <button data-c="rock">\u270A<span>ROCK</span></button>
    <button data-c="paper">\u270B<span>PAPER</span></button>
    <button data-c="scissors">\u270C\uFE0F<span>SCISSORS</span></button>
  </div>
  <div class="final" id="final"></div>
</div>
<script>
(function(){
  var EMO={rock:"\u270A", paper:"\u270B", scissors:"\u270C\uFE0F"};
  var BEAT={rock:"scissors", paper:"rock", scissors:"paper"};
  var youScoreEl=document.getElementById("youScore"), cpuScoreEl=document.getElementById("cpuScore"),
      roundEl=document.getElementById("round"), youPick=document.getElementById("youPick"),
      cpuPick=document.getElementById("cpuPick"), msg=document.getElementById("msg"), finalEl=document.getElementById("final");
  var you=0, cpu=0, match=1, busy=false, over=false;

  function reset(){
    you=0; cpu=0; over=false; busy=false;
    youScoreEl.textContent="0"; cpuScoreEl.textContent="0";
    roundEl.textContent="Match "+match;
    youPick.textContent="\u2753"; cpuPick.textContent="\u2753";
    msg.textContent="Pick your move."; msg.className="msg"; finalEl.textContent="";
  }
  function setMsg(t, cls){ msg.textContent=t; msg.className="msg"+(cls?" "+cls:""); }
  function play(p){
    if(busy||over) return;
    busy=true;
    youPick.textContent=EMO[p]; youPick.classList.remove("pulse"); void youPick.offsetWidth; youPick.classList.add("pulse");
    cpuPick.textContent="\u2753";
    setMsg("CPU is deciding\u2026", "");
    setTimeout(function(){
      var keys=["rock","paper","scissors"];
      var c=keys[(Math.random()*3)|0];
      cpuPick.textContent=EMO[c]; cpuPick.classList.remove("pulse"); void cpuPick.offsetWidth; cpuPick.classList.add("pulse");
      var result = p===c ? "tie" : (BEAT[p]===c ? "win" : "lose");
      if(result==="win"){ you++; youScoreEl.textContent=you; setMsg("You win this round!", "win"); }
      else if(result==="lose"){ cpu++; cpuScoreEl.textContent=cpu; setMsg("CPU takes the round.", "lose"); }
      else { setMsg("It's a tie. Go again.", "tie"); }
      if(you>=3 || cpu>=3){
        over=true; busy=false;
        finalEl.textContent = you>=3 ? "You win the match " + you + "-" + cpu + "!" : "CPU wins the match " + cpu + "-" + you + ".";
        youPick.textContent="\u2753"; cpuPick.textContent="\u2753";
        setTimeout(function(){ finalEl.textContent += "  Click any move to play again."; }, 10);
      } else {
        busy=false;
      }
    }, 380);
  }
  [].forEach.call(document.querySelectorAll(".choices button"), function(b){
    b.addEventListener("click", function(){
      if(over){ match++; reset(); return; }
      play(b.dataset.c);
    });
  });
  reset();
})();
</script>
</body>
</html>
