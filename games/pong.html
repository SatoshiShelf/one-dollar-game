<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pong</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c10;color:#eef1f5;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{max-width:100%;max-height:100%;width:auto;height:auto;touch-action:none;
    border-radius:10px;background:#05070a;box-shadow:0 12px 40px -12px rgba(0,0,0,.8)}
</style>
</head>
<body>
<canvas id="c" width="520" height="340"></canvas>
<script>
(function(){
  var cv=document.getElementById("c"), ctx=cv.getContext("2d");
  var W=cv.width, H=cv.height;
  var PADW=12, PADH=76, WIN=7;
  var you, cpu, ball, ys, cs, state, keys, tstart;
  function reset(full){
    you={x:18, y:H/2-PADH/2}; cpu={x:W-18-PADW, y:H/2-PADH/2};
    ball={x:W/2, y:H/2, r:7, vx:0, vy:0};
    keys={}; state="ready";
    if (full){ ys=0; cs=0; }
    serve(Math.random()<0.5?1:-1);
  }
  function serve(dir){
    var sp=4.4, ang=(Math.random()*0.6-0.3);
    ball.x=W/2; ball.y=H/2;
    ball.vx=Math.cos(ang)*sp*dir; ball.vy=Math.sin(ang)*sp;
    state="ready";
  }
  function step(){
    var pspeed=6.2;
    if (keys.up) you.y-=pspeed;
    if (keys.down) you.y+=pspeed;
    you.y=Math.max(0, Math.min(H-PADH, you.y));

    var cpuCenter=cpu.y+PADH/2;
    var target=ball.y - PADH/2;
    var csp=3.4;
    if (Math.abs(ball.x-(W-18))<220){
      if (cpu.y+PADH/2 < ball.y-6) cpu.y=Math.min(H-PADH, cpu.y+csp);
      else if (cpu.y+PADH/2 > ball.y+6) cpu.y=Math.max(0, cpu.y-csp);
    } else {
      var rest=H-PADH;
      if (cpu.y+PADH/2 < H/2-6) cpu.y=Math.min(rest, cpu.y+1.6);
      else if (cpu.y+PADH/2 > H/2+6) cpu.y=Math.max(0, cpu.y-1.6);
    }

    if (state!=="play") return;
    ball.x+=ball.vx; ball.y+=ball.vy;
    if (ball.y-ball.r<0){ ball.y=ball.r; ball.vy*=-1; }
    if (ball.y+ball.r>H){ ball.y=H-ball.r; ball.vy*=-1; }

    var hitYou = ball.x-ball.r<=you.x+PADW && ball.x>you.x && ball.y>=you.y && ball.y<=you.y+PADH;
    if (ball.vx<0 && hitYou){
      var rel=(ball.y-(you.y+PADH/2))/(PADH/2);
      var sp=Math.min(9, Math.hypot(ball.vx,ball.vy)+0.25);
      var ang=rel*0.9;
      ball.vx=Math.cos(ang)*sp; ball.vy=Math.sin(ang)*sp;
      ball.x=you.x+PADW+ball.r+0.1;
    }
    var hitCpu = ball.x+ball.r>=cpu.x && ball.x<cpu.x+PADW && ball.y>=cpu.y && ball.y<=cpu.y+PADH;
    if (ball.vx>0 && hitCpu){
      var rel2=(ball.y-(cpu.y+PADH/2))/(PADH/2);
      var sp2=Math.min(9, Math.hypot(ball.vx,ball.vy)+0.25);
      var ang2=Math.PI - rel2*0.9;
      ball.vx=Math.cos(ang2)*sp2; ball.vy=Math.sin(ang2)*sp2;
      ball.x=cpu.x-ball.r-0.1;
    }
    if (ball.x<-20){ cs++; point(-1); }
    else if (ball.x>W+20){ ys++; point(1); }
  }
  function point(dir){
    if (ys>=WIN || cs>=WIN) return;
    serve(dir);
  }
  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); }
  function draw(){
    ctx.fillStyle="#05070a"; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="rgba(255,255,255,.09)"; ctx.lineWidth=3; ctx.setLineDash([9,12]);
    ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle="#f7931a"; rr(you.x,you.y,PADW,PADH,6);
    ctx.fillStyle="#38bdf8"; rr(cpu.x,cpu.y,PADW,PADH,6);
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,7); ctx.fill();
    ctx.fillStyle="#98a2b3"; ctx.font="800 30px Inter, Arial"; ctx.textAlign="center";
    ctx.fillText(ys, W/2-44, 44); ctx.fillText(cs, W/2+44, 44);
    ctx.font="500 12px Inter, Arial"; ctx.textAlign="left"; ctx.fillText("YOU", 14, 20);
    ctx.textAlign="right"; ctx.fillText("CPU", W-14, 20);
    if (state==="ready"){
      ctx.textAlign="center"; ctx.fillStyle="#eef1f5"; ctx.font="600 15px Inter, Arial";
      ctx.fillText("Click or press Space to serve", W/2, H-22);
    }
    if (ys>=WIN || cs>=WIN){
      ctx.fillStyle="rgba(5,7,10,.85)"; ctx.fillRect(0,0,W,H);
      ctx.textAlign="center";
      ctx.fillStyle= ys>cs ? "#22c55e" : "#ef4444"; ctx.font="800 40px Inter, Arial";
      ctx.fillText(ys>cs ? "You win!" : "CPU wins", W/2, H/2-16);
      ctx.fillStyle="#f7931a"; ctx.font="700 22px Inter, Arial";
      ctx.fillText(ys+" - "+cs, W/2, H/2+22);
      ctx.fillStyle="#98a2b3"; ctx.font="500 15px Inter, Arial";
      ctx.fillText("Click or press Space for a rematch", W/2, H/2+58);
    }
  }
  var last=0, acc=0;
  function loop(t){
    requestAnimationFrame(loop);
    if(!last) last=t; acc+=t-last; last=t;
    while (acc>=16){ acc-=16; step(); }
    draw();
  }
  function action(){
    if (ys>=WIN || cs>=WIN) reset(true);
    else if (state==="ready") state="play";
  }
  addEventListener("keydown", function(e){
    if (e.key==="ArrowUp"||e.key==="w"||e.key==="W"){ keys.up=true; e.preventDefault(); action(); }
    if (e.key==="ArrowDown"||e.key==="s"||e.key==="S"){ keys.down=true; e.preventDefault(); action(); }
    if (e.key===" "){ e.preventDefault(); action(); }
  });
  addEventListener("keyup", function(e){
    if (e.key==="ArrowUp"||e.key==="w"||e.key==="W") keys.up=false;
    if (e.key==="ArrowDown"||e.key==="s"||e.key==="S") keys.down=false;
  });
  function moveTo(clientY){
    var r=cv.getBoundingClientRect();
    var y=(clientY-r.top)*H/r.height;
    you.y=Math.max(0, Math.min(H-PADH, y-PADH/2));
    if (state==="ready") action();
  }
  cv.addEventListener("mousemove", function(e){ moveTo(e.clientY); });
  cv.addEventListener("mousedown", function(){ action(); });
  cv.addEventListener("touchstart", function(e){ moveTo(e.touches[0].clientY); e.preventDefault(); }, {passive:false});
  cv.addEventListener("touchmove", function(e){ moveTo(e.touches[0].clientY); e.preventDefault(); }, {passive:false});

  reset(true);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
