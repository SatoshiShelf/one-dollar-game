<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game — One Dollar Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23f7931a'/><text x='50' y='72' font-size='60' text-anchor='middle' fill='%23201400' font-family='Arial' font-weight='bold'>$1</text></svg>">
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="mark">$1</span> One Dollar Game</a>
    <nav class="site"><a href="index.html#games">All games</a><a class="cta" href="free.html">Free game</a></nav>
  </div>
</header>

<div class="wrap">
  <div class="crumbs"><a href="index.html">Home</a> &nbsp;/&nbsp; <a href="index.html#games">Games</a> &nbsp;/&nbsp; <span id="crumb"></span></div>
  <div class="product-layout">
    <div class="product-head" id="head"></div>
    <aside class="buybox" id="buybox"></aside>
  </div>
  <section class="section" id="related" style="padding-top:0">
    <div class="section-head" style="margin-bottom:26px"><span class="kicker">Keep playing</span><h2 style="font-size:24px">More $1 games</h2></div>
    <div class="related" id="relatedGrid"></div>
  </section>
</div>

<footer class="site">
  <div class="wrap">
    <div class="fine" style="border-top:none;margin-top:0;padding-top:0">
      &copy; <span id="year"></span> One Dollar Game &middot; All sales final
    </div>
  </div>
</footer>

<script src="assets/coins.js"></script>
<script src="assets/games.js"></script>
<script src="assets/app.js"></script>
<script src="assets/qrcode.js"></script>
<script>
const { fmtUsd, fmtUnits, usdToUnits, coinUri, renderQR, verify, isSecure,
        CFG, coin, receiveAddress, availableCoins } = window.Store;
document.getElementById("year").textContent = new Date().getFullYear();

const id = new URLSearchParams(location.search).get("id");
const g = window.GAMES.find(x => x.id === id) || window.GAMES[0];
document.title = g.name + " — One Dollar Game";
document.getElementById("crumb").textContent = g.name;

document.getElementById("head").innerHTML = `
  <div class="cover t1" style="height:150px;border-radius:16px;border:1px solid var(--border-soft);margin-bottom:22px">
    <span class="tagpill">${g.cat}</span>
    <span class="glyph" style="font-size:56px">${g.emoji}</span>
  </div>
  <h1>${g.name}</h1>
  <p class="tag">${g.tagline}</p>
  <div class="product-body">
    <h2>About the game</h2>
    <p>${g.desc}</p>
    <h2>Play it free</h2>
    <p>Try the full game right here before you buy — it runs in your browser, no download.</p>
    <div class="playwrap">
      <iframe id="demo" title="${g.name} demo" src="${g.demo}" loading="lazy"></iframe>
      <div class="playnote" id="playnote">Loading the game&hellip;</div>
    </div>
    <h2>What you get for $1</h2>
    <ul class="checks">
      <li>The full game as one offline HTML file yours forever</li>
      <li>The complete Python source code for the game</li>
      <li>No ads, no login, no DRM, no tracking</li>
      <li>Instant download the moment your payment is seen on-chain</li>
    </ul>
  </div>`;

const frame = document.getElementById("demo");
frame.addEventListener("load", () => {
  const n = document.getElementById("playnote");
  if (n) n.remove();
});

const related = window.GAMES.filter(x => x.id !== g.id).slice(0, 8);
document.getElementById("relatedGrid").innerHTML = related.map(x => `
  <a class="mini" href="game.html?id=${encodeURIComponent(x.id)}">
    <span class="g">${x.emoji}</span>
    <span><span class="t">${x.name}</span><br><span class="p">$1 &middot; ${x.tagline}</span></span>
  </a>`).join("");

const box = document.getElementById("buybox");
const coins = availableCoins();
box.innerHTML = `
  <div class="flowsteps">
    <div class="s active" id="st1">1&nbsp; Pay</div>
    <div class="s" id="st2">2&nbsp; Verify</div>
    <div class="s" id="st3">3&nbsp; Download</div>
  </div>
  <p class="title">${g.name}</p>
  <div class="amount">${fmtUsd(CFG.priceUsd)}</div>
  ${coins.length ? `
  <label class="field" for="coinSel">Pay with</label>
  <select class="control" id="coinSel">
    ${coins.map(c => `<option value="${c.code}">${c.name} (${c.code})</option>`).join("")}
  </select>
  <div class="sats" id="sats">loading live price&hellip;</div>
  <button class="btn block" id="payBtn">Show payment details</button>

  <div class="pay" id="pay">
    <div class="qrbox" id="qr"></div>
    <div class="coinamount" id="coinamount"></div>
    <div class="addr" id="addr" title="Click to copy"></div>
    <div class="copy-hint" id="hint">Tap the address to copy it</div>
    <a class="btn ghost block small" id="walletLink" style="margin-bottom:16px">Open in wallet</a>
    <label class="field" for="txid">Paste your transaction ID after paying</label>
    <input class="control" id="txid" placeholder="transaction ID / hash" autocomplete="off" spellcheck="false">
    <button class="btn block" id="verifyBtn" style="margin-top:12px">Verify payment</button>
    <div class="notice" id="note"></div>
    <div class="deliver hidden" id="deliver">
      <h4>&#10004; Payment confirmed</h4>
      <p class="muted" id="deliverMsg" style="margin:0 0 12px"></p>
      <a class="btn small block" id="dl" href="#" download>Download now</a>
    </div>
  </div>` : `
  <div class="notice show err">Checkout is not configured yet. Add wallet addresses in <b>assets/coins.js</b>.</div>`}

  <div class="guarantee">
    <div>&#9889; Instant delivery after payment</div>
    <div>&#128274; No signup &middot; no card &middot; no tracking</div>
    <div>&#8383; Paid on-chain to a self-custody address</div>
  </div>`;

function note(kind, msg) {
  const n = document.getElementById("note");
  n.className = "notice show " + kind;
  n.textContent = msg;
}
function currentCoin() { return coin(document.getElementById("coinSel").value); }

let amountUnits = null;

async function refresh() {
  const c = currentCoin();
  const sats = document.getElementById("sats");
  const ca = document.getElementById("coinamount");
  try {
    amountUnits = await usdToUnits(c.code, CFG.priceUsd);
    const amt = fmtUnits(c, amountUnits);
    sats.innerHTML = "&#8776; " + amt + " " + c.unit + " for $" + CFG.priceUsd;
    ca.textContent = amt + " " + c.unit;
    const uri = coinUri(c, amountUnits, "One Dollar Game: " + g.id);
    document.getElementById("walletLink").href = uri;
    renderQR(document.getElementById("qr"), uri);
    const addr = receiveAddress(c);
    document.getElementById("addr").textContent = addr;
    document.getElementById("addr").dataset.addr = addr;
  } catch (e) {
    sats.textContent = "live price unavailable — refresh in a moment";
    ca.textContent = "";
  }
}

if (coins.length) {
  document.getElementById("coinSel").addEventListener("change", refresh);
  refresh();

  document.getElementById("payBtn").addEventListener("click", () => {
    document.getElementById("pay").classList.add("show");
    document.getElementById("st1").classList.add("active");
    const btn = document.getElementById("payBtn");
    btn.textContent = "Waiting for payment\u2026";
    btn.disabled = true;
  });

  document.getElementById("addr").addEventListener("click", async () => {
    const h = document.getElementById("hint");
    const cur = h.textContent;
    try { await navigator.clipboard.writeText(document.getElementById("addr").dataset.addr); h.textContent = "Address copied \u2713"; }
    catch { h.textContent = "Select and copy manually"; }
    setTimeout(() => { h.textContent = cur; }, 1600);
  });

  document.getElementById("verifyBtn").addEventListener("click", async () => {
    const btn = document.getElementById("verifyBtn");
    btn.disabled = true; btn.textContent = "Checking\u2026";
    document.getElementById("st2").classList.add("active");
    try {
      const res = await verify(g.id, currentCoin().code, document.getElementById("txid").value);
      if (!res.ok) note("err", res.reason);
      else {
        note("info", res.confirmed ? "Confirmed on-chain." : "Seen in mempool — confirmation follows shortly.");
        document.getElementById("st3").classList.add("active");
        document.getElementById("dl").href = res.downloadUrl;
        document.getElementById("deliverMsg").textContent = "Payment verified. Your game + Python source is ready — the link expires in 15 minutes.";
        document.getElementById("deliver").classList.remove("hidden");
      }
    } catch (e) { note("err", "Error: " + e.message); }
    finally { btn.disabled = false; btn.textContent = "Verify payment"; }
  });
}
</script>
</body>
</html>
